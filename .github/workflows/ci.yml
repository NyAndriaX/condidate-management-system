name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  NODE_VERSION: "20"
  MONGODB_URI: mongodb://localhost:27017/candidates_test
  JWT_SECRET: ci-test-secret-key-not-for-production
  PORT: 5000
  NODE_ENV: test

jobs:
  # ─────────────────────────────────────────
  backend-test:
    name: Backend — Tests & Coverage
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check || true

      - name: Unit tests with coverage
        run: npm run test:unit -- --coverage --coverageReporters=lcov --coverageReporters=text-summary

      - name: Integration tests
        run: npm run test:integration
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Security tests
        run: npm run test:security
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Check coverage threshold
        run: |
          COVERAGE=$(npm run test:unit -- --coverage --coverageReporters=json-summary 2>/dev/null | grep -o '"pct":[0-9.]*' | head -1 | grep -o '[0-9.]*' || echo "0")
          echo "Coverage: $COVERAGE%"

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          directory: backend/coverage
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────
  frontend-test:
    name: Frontend — Tests & Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint || true

      - name: Type check
        run: yarn type-check

      - name: Tests with coverage
        run: yarn test --watchAll=false --testPathPattern='(hooks|utils)' --coverage --collectCoverageFrom='src/hooks/**/*.ts' --collectCoverageFrom='src/utils/**/*.ts' --coverageReporters=lcov --coverageReporters=text-summary
        env:
          CI: true

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/coverage
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────
  coverage-gate:
    name: Coverage Gate (≥ 90%)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check backend coverage threshold
        working-directory: backend
        run: |
          npm ci --silent
          npm run test:unit -- --coverage --collectCoverageFrom='src/services/**/*.ts' --collectCoverageFrom='src/models/**/*.ts' --coverageThreshold='{"global":{"lines":90,"functions":90,"branches":90,"statements":90}}' --coverageReporters=text-summary
        env:
          NODE_ENV: test
          MONGODB_URI: ${{ env.MONGODB_URI }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          PORT: ${{ env.PORT }}

      - name: Check frontend coverage threshold
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile --silent
          yarn test --watchAll=false --testPathPattern='(hooks|utils)' --coverage --collectCoverageFrom='src/hooks/**/*.ts' --collectCoverageFrom='src/utils/**/*.ts' --coverageThreshold='{"global":{"lines":90,"functions":90,"branches":70,"statements":90}}' --coverageReporters=text-summary
        env:
          CI: true

  # ─────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: backend

      - name: Start backend
        run: npm run dev &
        working-directory: backend
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          PORT: ${{ env.PORT }}
          NODE_ENV: development

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health && echo "Backend ready" && break
            sleep 2
          done

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: backend

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: backend/test-results/
          retention-days: 7
