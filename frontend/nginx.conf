server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── API proxy ─────────────────────────────────────────
    # All /api/* calls are forwarded to the backend service on the docker network.
    # Using the "backend" service name + a runtime resolver makes nginx recover
    # if the backend container is restarted.
    resolver 127.0.0.11 ipv6=off valid=30s;

    location /api/ {
        set $backend_upstream "http://backend:5000";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Backend health passthrough (optional, useful for uptime checks)
    location = /health {
        set $backend_upstream "http://backend:5000";
        proxy_pass $backend_upstream/health;
    }

    # ── React Router SPA fallback ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
